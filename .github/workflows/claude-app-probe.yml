name: Claude App Probe

# Temporary caller workflow for a live probe of the official Claude GitHub App token and hooks.
# Pinned to the test/claude-app-probe branch of oneable-dev/.github. Remove after the probe.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".claude-app-probe/**"
      - ".github/workflows/claude-app-probe.yml"
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions: {}

jobs:
  actors:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app'))
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/claude-app-probe') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Print actor context
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "event_name=$EVENT_NAME"
          echo "event.action=$EVENT_ACTION"
          echo "actor=$ACTOR"
          echo "triggering_actor=$TRIGGERING_ACTOR"
          echo "event.sender.login=$SENDER_LOGIN"
          echo "head_ref=$HEAD_REF"
          echo "run_id=$RUN_ID"
          echo "run_attempt=$RUN_ATTEMPT"
          echo "pull_request.head.sha=$PR_HEAD_SHA"

  core:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app')
      && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    concurrency:
      group: claude-app-probe-core-${{ github.event.pull_request.number }}${{ github.actor == 'claude[bot]' && format('-bot-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
          fetch-depth: 0
      - uses: oneable-dev/.github/.github/actions/claude-app-probe@test/claude-app-probe
        with:
          mode: ${{ github.head_ref == 'probe/claude-app-a' && 'full' || 'exchange' }}
          label: core
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  reusable:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app') && github.actor != 'claude[bot]')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/claude-app-probe') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: oneable-dev/.github/.github/workflows/claude-app-probe.yml@test/claude-app-probe
    with:
      mode: exchange
      checkout_ref: ${{ github.head_ref }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  direct:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app') && github.actor != 'claude[bot]')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '/claude-app-probe') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      # head_ref is empty on issue_comment, so checkout falls back to the default branch there.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false
      - name: Run Claude Code Action
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@61a9c274fa7110a66dfafc1bbbced03833eb25fe
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "Reply with OK. Do not use tools."
          claude_args: --model haiku --max-turns 1
          classify_inline_comments: "false"
      - name: Post-check app token revocation
        if: always()
        env:
          TOKEN: ${{ steps.claude.outputs.github_token }}
          CONCLUSION: ${{ steps.claude.outcome }}
        run: |
          if [ -n "$TOKEN" ]; then
            present=yes
            status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" https://api.github.com/installation/repositories)
          else
            present=no
            status=n/a
          fi
          echo "PROBE label=direct inv=1 conclusion=$CONCLUSION token_present=$present post_revoke_status=$status"

  m5_same:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app')
      && github.head_ref == 'probe/claude-app-a' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: probe-m5-same-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - run: sleep 480

  m5_botkey:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'probe/claude-app')
      && github.head_ref == 'probe/claude-app-a' && github.actor != 'claude[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    concurrency:
      group: probe-m5-bot-${{ github.event.pull_request.number }}${{ github.actor == 'claude[bot]' && format('-bot-{0}', github.run_id) || '' }}
      cancel-in-progress: true
    steps:
      - run: sleep 480

  m2:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - uses: oneable-dev/.github/.github/actions/claude-app-probe@test/claude-app-probe
        with:
          mode: m2
          label: m2
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
