name: Claude Mention

# Answers @claude mentions in PR comments, review comments, reviews and new issues.
#
# This file must be on the default branch to work. issue_comment and issues events only run
# workflow files from the default branch, so it does nothing until it is merged.
#
# Trial wiring: the reusable workflow is pinned to the feat/claude-review-loop branch of
# oneable-dev/.github. Switch to @main once that branch is merged.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  mention:
    uses: oneable-dev/.github/.github/workflows/claude-mention.yml@feat/claude-review-loop
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
