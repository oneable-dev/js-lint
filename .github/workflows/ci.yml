name: CI

# Runs the same checks the Claude Review workflow uses (pnpm lint, typecheck, test), so a failure
# blocks the PR without depending on an agent to run them.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm 11 matches the lockfile and the minimumReleaseAge settings in pnpm-workspace.yaml.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.5.0

      # The oxlint config is TypeScript and needs Node type stripping (Node >= 22.13).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm lint` builds first because the presets load this package from dist.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test
